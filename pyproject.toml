# Comfy Registry / packaging metadata.
# Publish with `comfy node publish` (comfy-cli). PublisherId must be filled in
# first — the registry rejects an empty one.
# Registry docs: https://docs.comfy.org/registry/overview

[project]
name = "tinode"
version = "0.1.0"
description = "Interactive crop, mask and SAM3 segment-selection nodes for ComfyUI video work."
license = { text = "MIT" }
requires-python = ">=3.10"
readme = "README.md"
# Empty on purpose — see requirements.txt for why (torch/numpy/Pillow come from
# ComfyUI; cv2 is left unpinned; the face extras are optional).
dependencies = []

[project.optional-dependencies]
# pip install -r requirements-face.txt  (or: pip install ".[face]")
face = ["insightface", "onnxruntime", "mediapipe"]

[project.urls]
Repository = "https://github.com/mgkgng/tinode"

[tool.comfy]
PublisherId = ""
DisplayName = "tinode"
Icon = ""
